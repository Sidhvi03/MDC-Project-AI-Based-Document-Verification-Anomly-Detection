{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h2>Verify an invoice</h2><p>Upload a JPG, PNG, TIFF, or BMP image. OCR runs locally through Tesseract.</p><form method="post" enctype="multipart/form-data"><label for="invoice">Invoice image</label><input id="invoice" name="invoice" type="file" accept=".jpg,.jpeg,.png,.tif,.tiff,.bmp" required><button type="submit">Extract and verify</button></form><p class="hint">This prototype does not approve payments or determine fraud. Review flagged results manually.</p></section>{% endblock %}
